name: QA

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Link / id / metadata check (zero-dependency)
        run: python3 scripts/qa_check.py

      - name: Set up Java (for HTML validator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: HTML validation (Nu validator)
        run: |
          python3 -m pip install --quiet html5validator
          html5validator --root . --also-check-css \
            --ignore-re 'Attribute .* not allowed' \
            --log INFO
