<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Page Not Found | Forg3d.Art</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Barlow:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --panel: #161616;
    --border: #2a2a2a;
    --iron: #9a9a9a;
    --white: #f0ede8;
    --gold: #c9a84c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--black); color: var(--white);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 48px 24px;
  }
  .error-code {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(120px, 20vw, 200px);
    line-height: 1; color: var(--gold); opacity: 0.15;
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -60%);
  }
  .content { position: relative; z-index: 1; }
  .tag {
    font-family: 'Share Tech Mono', monospace; font-size: 11px;
    letter-spacing: 4px; color: var(--gold); text-transform: uppercase;
    margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
    justify-content: center;
  }
  .tag::before, .tag::after { content: ''; width: 30px; height: 1px; background: var(--gold); }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 8vw, 80px);
    letter-spacing: 3px; line-height: 1; margin-bottom: 16px;
  }
  h1 span { color: var(--gold); }
  p {
    font-size: 16px; color: var(--iron); font-weight: 300;
    line-height: 1.7; max-width: 420px; margin: 0 auto 40px;
  }
  .actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 14px 32px; font-family: 'Share Tech Mono', monospace;
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    text-decoration: none; transition: all 0.25s;
  }
  .btn-gold {
    background: var(--gold); color: var(--black); font-weight: 700;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-gold:hover { background: #e05c2a; transform: translateY(-2px); }
  .btn-ghost {
    border: 1px solid var(--border); color: var(--iron);
  }
  .btn-ghost:hover { border-color: var(--iron); color: var(--white); }
</style>
</head>
<body>
  <div class="error-code">404</div>
  <div class="content">
    <div class="tag">Error 404</div>
    <h1>PAGE <span>NOT FOUND</span></h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="actions">
      <a href="/" class="btn btn-gold">Back to Home</a>
      <a href="/custom-gifts.html" class="btn btn-ghost">Custom Gifts →</a>
    </div>
  </div>
</body>
</html>
